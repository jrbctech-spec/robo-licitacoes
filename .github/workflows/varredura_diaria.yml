name: Varredura Diaria de Licitacoes PNCP

on:
  schedule:
    # O GitHub usa o fuso UTC (Horário de Brasília/Palmas é UTC-3):
    # 12:00 UTC = 09:00 da manhã
    # 18:00 UTC = 15:00 da tarde
    - cron: '0 12,18 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo site do GitHub se quiser testar

jobs:
  executar-busca:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase openpyxl python-dotenv python-dotenv

      - name: Executar Varredura PNCP e Salvar no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python buscador_pncp.py
