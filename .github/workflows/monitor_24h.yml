name: Monitoramento 24h de Licitacoes (PNCP)

on:
  schedule:
    # Executa a cada 1 hora, 24 horas por dia (horário UTC)
    - cron: '0 * * * *'
  workflow_dispatch:
    # Permite disparar manualmente pelo botão no GitHub a qualquer momento

jobs:
  monitorar_pncp:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permissão para salvar o cache de deduplicação no repositório

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências necessárias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests pydantic python-dotenv; fi

      - name: Executar varredura do PNCP e envio de alertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/monitor_nuvem.py

      - name: Persistir histórico de deduplicação no Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/certames_notificados.json || true
          git commit -m "chore(cache): atualiza certames notificados [skip ci]" || echo "Nenhuma alteração no cache."
          git push || echo "Sem mudanças para enviar."
